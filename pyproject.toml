[project]
name = "cliptodance"
version = "0.0.1"
description = "画像検索コラージュAI(草案: docs/design.md)"
requires-python = ">=3.10"
# M0 時点では実行に必須の依存はない。重い依存(torch, open_clip, segment-anything, faiss 等)は
# 本番(GPU / Colab)で M1 以降に追加する。
dependencies = ["pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 素材の取り込み(M1)。重いので別にする。GPU のある環境では torch を CUDA 版で入れる。
ingest = ["numpy", "pillow", "torch", "torchvision", "open_clip_torch", "segment-anything", "opencv-python-headless", "scipy", "scikit-image", "faiss-cpu"]

[tool.setuptools]
packages = ["pipeline", "pipeline.pool", "pipeline.pool.sources", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
