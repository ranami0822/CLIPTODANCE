# 物の実寸の高さの表(R5)。docs/design.md「風景ルール」「採否の決定」参照。
# Photo Clip Art は種類ごとの高さ分布をデータから推定して使う。こちらは手で作る。
# 値は単位 m。mean = 平均、sd = 標準偏差(幅)。
# 下の値はすべて「仮置き」で、私の一般的な目安。出典はない。使う前に確かめて、
# 確かめた値は source に出典を書く(source が placeholder のままのものは未確認)。
# 表にない種類は、実行時に Clairic が実寸を提案する(設計書 R10)。
entries:
  person:
    mean: 1.7
    sd: 0.1
    source: placeholder
  dog:
    mean: 0.5
    sd: 0.15
    source: placeholder
  tree:
    mean: 8.0
    sd: 4.0
    source: placeholder
  house:
    mean: 6.0
    sd: 2.0
    source: placeholder
  # ---- ここから 2026-10-31 に追加(M2/M3 の試作用。すべて仮置きで、私の一般的な目安。出典はない) ----
  horse:
    mean: 1.6
    sd: 0.2
    source: placeholder
  cow:
    mean: 1.3
    sd: 0.15
    source: placeholder
  sheep:
    mean: 0.8
    sd: 0.1
    source: placeholder
  boat:
    mean: 3.0        # 帆や船体を含めた高さの目安。小舟は低く、帆船は高い(幅が大きい)
    sd: 1.5
    source: placeholder
  tower:
    mean: 15.0
    sd: 5.0
    source: placeholder
  column:
    mean: 4.0
    sd: 1.0
    source: placeholder
  # 空中の物は、遠近ではなく画面の高さに対する比で大きさを決める(height_frac)
  cloud:
    airborne: true
    height_frac: 0.22
    source: placeholder
  bird:
    airborne: true
    height_frac: 0.04
    source: placeholder
