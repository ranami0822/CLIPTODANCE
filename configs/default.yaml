# 値はすべて docs/design.md の初期値の案。M2 以降で素材を見て調整する。
pool: null              # 素材プール名(洋画・日本画・イラスト・写真 など)
max_elements: 6         # 要素数の上限

selection:
  top_k: 50             # 要素ごとのCLIP検索件数 K
  keep_per_element: 5   # 単体スコア上位 M
  beam_width: 10        # ビーム幅 B
  top_n_sets: 3         # 合成へ渡す組数 N

loop:
  max_retries: 3
  accept_threshold: null   # 未決定。M4 で調整
  weights:                 # 未決定。M4 で調整
    semantic: null
    naturalness: null
    consistency: null
    edge: null

canvas:
  aspect: [3, 2]        # 決定(R2)
  crop:                 # 土台の切り出し(R2a)
    horizon_target: 0.667   # 決定: 地平線を下の三分の一(上が0)に置く
    horizon_tolerance: 0.08 # 案。超えたら減点か除外
    min_crop_ratio: 0.6     # 案。窓の高さ/元画像の高さの下限(拡大しすぎない)

landscape:              # docs/design.md「風景ルール」。R1-R3 は決定、他は案(仮置き)
  base: single_landscape_image   # 決定(R1)
  perspective: horizon_foot      # 決定(R3): 地平線 + 足元位置でサイズを決める
  horizon:                       # 決定(R3a)
    pool_assets: estimate_then_review   # 取り込み時に推定し、目視で確認・修正
    user_background: estimate_then_confirm  # 実行時に推定し、確認画面で修正
    method: opencv_light         # 決定。スカイライン由来の初期値(軽い処理)。目視で直す前提
  placement:                     # 決定(R10): Clairic が提案し、規則が補正する
    mode: propose_then_correct   # 規則だけの縮退モードは設けない
    estimator_fields: [x, y_foot, scale_mult, rotation]   # height_m は表にない種類のときだけ追加で尋ねる
    height_table: configs/height_table.yaml               # 決定: 実寸は種類別の表(平均と幅)
    scale_mult_range: [0.5, 2.0]   # 案
    rotation_range_deg: [-15, 15]  # 案
  camera_height_m: 1.6           # 案(R5)
  main_height_ratio: [0.25, 0.60]  # 決定(R7): 目安のみ。補正・除外には使わない(評価の弱い項)
  main_height_ratio_enforced: false
  max_overlap_ratio: 0.30        # 案(R8)
  allow_out_of_canvas: false     # 案(R8)
  color_transfer:                # 決定(R9): Reinhard 2001(lαβ の平均・標準偏差を転送)
    method: reinhard_lab
    strength: 0.2                # 案。0〜1
    reference: local_context      # 配置位置の周辺の領域と合わせる
  compat_color_distance: chi2_lab_hist   # 決定: 素材の元画像と土台の Lab ヒストグラムの χ² 距離を相性に加える

coords:                 # 座標の規約(案)。地上物は足元中央、空中物は中心
  xy: normalized_0_1    # キャンバス幅・高さに対する 0-1、上が y=0
  z: derived_from_y_foot  # R6: 足元 y の小さい順に奥から重ねる
  rotation: degrees_cw  # 時計回り。足元(空中物は中心)が回転の中心

judge:
  backend: cloudflare   # 将来 local(Clef の重みは Apache 2.0 で HF にある)に差し替え
  model: clef           # clef | clef-flash(flash は約6分の1の消費。画像入力の精度は未確認)
  # 呼び出しは Workers AI REST。トークンは環境変数 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
  cache_path: data/judge_cache/judge.sqlite   # CachedJudge の SQLite
estimator:
  backend: cloudflare   # Clairic はプレビュー依存。代替: 格子候補 + Clef 採点

pool:                   # 素材プールの取り込み(M1)。数値はすべて初期案
  root: data/pool       # data/pool/<pool>/ に originals / work / cutouts / pool.sqlite
  source: met           # The Met Open Access(CC0)。検索は v1.1(offset / limit)
  sam:
    model: vit_b        # Apache 2.0
    points_per_side: 16 # CPU で 1 枚約 30 秒。32 だと約 90 秒(2026-10-31 実測、約 600×480 の画像)
  embedder: open_clip:ViT-B-32:laion2b_s34b_b79k   # コード・重みとも MIT
  work_max_side: 2048   # 作業用画像の長辺。元画像は originals/ に保存
  filter:
    min_area_ratio: 0.004
    max_area_ratio: 0.6
    dedupe_iou: 0.85
    max_cutouts_per_image: 12
    clutter_band_frac: 0.03   # Sketch2Photo は 30 ピクセル(画像サイズ不明)。長辺に対する比で持つ
  judge:
    model: clef-flash   # 約 6 分の 1 の消費。精度は未検証。clef と比べてから決める
    max_neurons_per_run: 3000
    image_max_side: 512

