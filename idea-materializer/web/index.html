<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイデア具現化マシーン</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>アイデア具現化マシーン</h1>
  <span id="badge" class="badge" hidden></span>
  <span id="status" class="status"></span>
</header>

<main>
  <aside id="panel">
    <section>
      <h2>① 素材 <small>画像を入れると物体を切り抜きます</small></h2>
      <label id="drop" class="drop" tabindex="0">
        画像をドロップ / クリックして選択<br><small>透過 PNG はそのまま、背景が単色の写真は自動で切り抜き</small>
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
      </label>
      <ul id="objlist"></ul>
    </section>

    <section>
      <h2>② テーマ・アイデア</h2>
      <textarea id="theme" rows="4" placeholder="例: 夏の朝、丘の上にぽつんと立つ家。木は少し傾けて、太陽は右上に。"></textarea>
    </section>

    <section>
      <h2>③ 具現化</h2>
      <button id="arrange" class="primary">Clairic で配置する</button>
      <label class="check"><input id="mock" type="checkbox"> モック配置(Clairic を呼ばない)</label>
      <label class="check"><input id="uncert" type="checkbox" checked> 80%範囲を表示</label>
      <p id="notes" class="notes"></p>
    </section>

    <section id="inspector" hidden>
      <h2>選択中: <span id="selname"></span></h2>
      <div class="sl"><label>x</label><input id="s_x" type="range" min="0" max="1" step="0.005"><output></output></div>
      <div class="sl"><label>y</label><input id="s_y" type="range" min="0" max="1" step="0.005"><output></output></div>
      <div class="sl"><label>z(奥↔手前)</label><input id="s_z" type="range" min="0" max="1" step="0.01"><output></output></div>
      <div class="sl"><label>大きさ</label><input id="s_scale" type="range" min="0.04" max="1" step="0.005"><output></output></div>
      <div class="sl"><label>回転°</label><input id="s_rot" type="range" min="-180" max="180" step="1"><output></output></div>
    </section>
  </aside>

  <div id="stagewrap">
    <div id="toolbar">
      <div class="seg" id="tools">
        <button data-tool="select" class="on">移動</button>
        <button data-tool="pen">ペン</button>
        <button data-tool="eraser">消しゴム</button>
      </div>
      <label>太さ <input id="pensize" type="range" min="2" max="24" value="6"></label>
      <button id="clearSketch">スケッチを消す</button>
      <label>比率
        <select id="aspect">
          <option value="4:3" selected>4:3</option><option value="1:1">1:1</option>
          <option value="16:9">16:9</option><option value="3:4">3:4</option>
        </select>
      </label>
      <label>スケッチの濃さ <input id="skop" type="range" min="0" max="1" step="0.05" value="0.55"></label>
      <span class="grow"></span>
      <button id="exportPng">PNG 保存</button>
      <button id="exportJson">配置 JSON</button>
    </div>
    <div id="stage">
      <canvas id="sketch"></canvas>
      <canvas id="scene"></canvas>
    </div>
    <p class="hint">ペンで粗い絵を描く → 「配置する」。素材はドラッグで移動、緑の丸で回転、ホイールで拡大縮小。Delete で削除。</p>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
